[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docker-mcp-service-template"
version = "0.1.8"
description = "A template for creating a microservice that integrates with Docker, providing a foundation for building scalable and efficient applications."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
keywords = ["cli", "command", "telegram", "bot", "integration", "python"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]

dependencies = [
    "custom-python-logger>=4.2.0",
    "mcp>=2.3.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-better-report>=1.0.3",
    "python-base-toolkit>=1.2.1",
]

[project.urls]
Homepage = "https://github.com/aviz92/docker-mcp-service-template"
Repository = "https://github.com/aviz92/docker-mcp-service-template"
Issues = "https://github.com/aviz92/docker-mcp-service-template/issues"

[tool.hatch.build.targets.wheel]
packages = ["mcp_services*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120
